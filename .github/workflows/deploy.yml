name: Secure Production Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (non-blocking for now)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/milyes/zcore-api:${{ github.sha }}, ghcr.io/milyes/zcore-api:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign keyless SLSA 3
        run: cosign sign --yes ghcr.io/milyes/zcore-api@${{ steps.build.outputs.digest }}
